name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: Build iOS artifacts
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync iOS
        run: |
          npm run build
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          npx cap sync ios

      - name: Build unsigned device app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/App.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/App.app"
          cd "$RUNNER_TEMP"
          zip -qry "Rinse-${VERSION}-ios-unsigned.ipa" Payload

      - name: Build simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-sim" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$RUNNER_TEMP/ios-sim/Build/Products/Release-iphonesimulator/App.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/Rinse-${VERSION}-ios-simulator.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            ${{ runner.temp }}/Rinse-*-ios-unsigned.ipa
            ${{ runner.temp }}/Rinse-*-ios-simulator.zip

  release:
    name: Publish GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts/ios

      - name: Name releases and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp artifacts/android/app-debug.apk "release/Rinse-${VERSION}-android-debug.apk"
          cp artifacts/ios/*.ipa "release/Rinse-${VERSION}-ios-unsigned.ipa"
          cp artifacts/ios/*.zip "release/Rinse-${VERSION}-ios-simulator.zip"
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Rinse ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
